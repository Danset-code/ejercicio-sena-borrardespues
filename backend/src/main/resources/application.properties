# ============================================================================
# Configuración de la aplicación TaskFlow - Spring Boot
# ============================================================================

# --- Nombre y puerto de la aplicación ---
spring.application.name=taskflow-backend
server.port=8080

# --- Configuración de base de datos H2 (desarrollo) ---
# H2 es una base de datos en memoria, ideal para desarrollo y pruebas.
# Para cambiar a MySQL, comenta estas líneas y descomenta las de abajo.
spring.datasource.url=jdbc:h2:mem:taskflowdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Configuración JPA / Hibernate ---
# create-drop: crea las tablas al iniciar, las elimina al detener
# Para producción usar: update (solo crea/modifica lo necesario)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Consola H2 (accesible desde navegador en desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Inicialización de datos ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

